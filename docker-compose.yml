# ПОСТЕР на сервере в интернете: приложение + Caddy + сайт-визитка.
#
# Caddy принимает 80/443, сам получает и продлевает сертификат Let's Encrypt
# для домена из POSTER_DOMAIN. В корне домена лежит сайт-визитка (папка
# site/), система живёт под путём POSTER_BASE_PATH («/poster-crm») и получает
# запросы по внутренней сети. Порт 8000 наружу не открыт: к приложению можно
# попасть только через Caddy по https.
#
# Запуск:   cp .env.example .env  →  заполнить  →  docker compose up -d
# Обновить: git pull && docker compose up -d --build
# Подробно — README, «Удалённый доступ».

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # снаружи — всегда строгий режим; отключить можно только сознательно,
      # убрав эту строку
      POSTER_PUBLIC: "1"
      # путь на домене; тот же читает Caddy. Пусто — система в корне домена
      POSTER_BASE_PATH: ${POSTER_BASE_PATH:-/poster-crm}
      # пути к данным задаются здесь, а не в .env: строки вроде
      # POSTER_LOG_DIR=./logs из .env.example иначе увели бы логи и макеты
      # из тома внутрь контейнера, где они пропадают при пересборке
      POSTER_DB_URL: sqlite:////app/data/poster.db
      POSTER_BACKUP_DIR: /app/data/backups
      POSTER_DESIGNS_DIR: /app/data/designs
      POSTER_LOG_DIR: /app/data/logs
    volumes:
      # база, копии, макеты, логи — всё здесь; образ можно пересобирать
      - ./data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # домен, на который указывает DNS сервера; тот же, что в POSTER_ALLOWED_HOSTS
      POSTER_DOMAIN: ${POSTER_DOMAIN:?задайте POSTER_DOMAIN в .env}
      POSTER_BASE_PATH: ${POSTER_BASE_PATH:-/poster-crm}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # сайт-визитка: статические файлы. Заменить на свои — просто положить в site/
      - ./site:/srv/site:ro
      # сертификаты и ключи Let's Encrypt — чтобы не запрашивать заново при перезапуске
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

# Всё на одном сервере: система (app), сайт-визитка (site) и Caddy.
#
# Caddy принимает 80/443, сам получает и продлевает сертификат Let's Encrypt
# для домена из POSTER_DOMAIN. В корне домена — визитка, система живёт под
# путём POSTER_BASE_PATH («/poster-crm»). Оба приложения доступны только по
# внутренней сети: наружу открыты лишь порты Caddy.
#
# Настройки: корневой .env (домен, путь) + poster-ocr/.env (сама система).
# Запуск:   docker compose up -d
# Обновить: git pull && docker compose up -d --build
# Подробно — README в корне. Первый запуск — скрипт deploy/setup.sh.

# Журналы контейнеров Docker по умолчанию растут без предела и однажды
# занимают весь диск. Три файла по 10 МБ на контейнер — с запасом на
# разбор проблем за последние дни. (Журнал самой системы — в data/logs,
# у него своя ротация.)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: ./poster-ocr
    restart: unless-stopped
    logging: *logging
    env_file: ./poster-ocr/.env
    environment:
      # снаружи — всегда строгий режим; отключить можно только сознательно,
      # убрав эту строку
      POSTER_PUBLIC: "1"
      # домен и путь — из корневого .env, чтобы не дублировать их в двух файлах
      POSTER_ALLOWED_HOSTS: ${POSTER_DOMAIN:?задайте POSTER_DOMAIN в .env}
      POSTER_BASE_PATH: ${POSTER_BASE_PATH:-/poster-crm}
      # пути к данным задаются здесь, а не в .env: строки вроде
      # POSTER_LOG_DIR=./logs из .env.example иначе увели бы логи и макеты
      # из тома внутрь контейнера, где они пропадают при пересборке
      POSTER_DB_URL: sqlite:////app/data/poster.db
      POSTER_BACKUP_DIR: /app/data/backups
      POSTER_DESIGNS_DIR: /app/data/designs
      POSTER_LOG_DIR: /app/data/logs
    volumes:
      # база, копии, макеты, логи — всё здесь; образ можно пересобирать
      - ./data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  site:
    # сайт-визитка: собирается из исходников при docker compose build и
    # отдаётся своим маленьким Caddy (poster-website/Dockerfile)
    build: ./poster-website
    restart: unless-stopped
    logging: *logging
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      - app
      - site
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      POSTER_DOMAIN: ${POSTER_DOMAIN:?задайте POSTER_DOMAIN в .env}
      POSTER_BASE_PATH: ${POSTER_BASE_PATH:-/poster-crm}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # сертификаты и ключи Let's Encrypt — чтобы не запрашивать заново при перезапуске
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

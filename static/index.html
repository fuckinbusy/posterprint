<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ПОСТЕР · Заказы</title>
<meta name="robots" content="noindex, nofollow" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<!-- ============ ЭКРАН ВЫБОРА ПРОФИЛЯ ============ -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-brand">
      <span class="reg" aria-hidden="true"><i></i></span>
      <span>ПОСТЕР<span class="dot">.</span></span>
    </div>
    <div class="spotbar" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <h1 class="gate-title">Кто работает?</h1>
    <p class="gate-sub">Выберите профиль — он запомнится на этом компьютере</p>
    <p class="gate-device" id="gateDevice"></p>

    <div class="gate-list" id="gateChoices"></div>

    <form class="gate-pass" id="gatePass" hidden>
      <div class="field">
        <label for="gatePassInput" id="gatePassLabel">Пароль</label>
        <input id="gatePassInput" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <div class="gate-pass-err" id="gatePassErr" hidden></div>
      <div class="gate-pass-row">
        <button class="btn btn-ghost" type="button" id="gateBack">Назад</button>
        <button class="btn btn-green" type="submit" id="gateEnter">Войти</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ ШАПКА ============ -->
<header class="topbar">
  <div class="tb-left">
    <div class="brand">
      <span class="reg" aria-hidden="true"><i></i></span>
      <span>ПОСТЕР<span class="dot">.</span><small>ЦЕХ · ЗАКАЗЫ</small></span>
    </div>
    <div class="spotbar" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  </div>

  <nav class="tb-nav" id="mainNav" aria-label="Разделы">
    <a href="#/board" class="nav-tab active" data-view="board" title="Заказы">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5.5" height="16" rx="1.4"/><rect x="9.5" y="4" width="5" height="11" rx="1.4"/><rect x="15.5" y="4" width="5.5" height="16" rx="1.4"/></svg>
      <span>Заказы</span>
    </a>
    <a href="#/clients" class="nav-tab" data-view="clients" title="Клиенты" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c.7-3.6 3.6-5.4 6.5-5.4s5.8 1.8 6.5 5.4"/><path d="M17 4.5a3.4 3.4 0 0 1 0 6.8"/><path d="M21.5 20c-.3-1.6-.9-2.9-1.8-3.8"/></svg>
      <span>Клиенты</span>
    </a>
    <a href="#/prices" class="nav-tab" data-view="prices" title="Прайс" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 12 22l-9-9V4a1 1 0 0 1 1-1h9z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>
      <span>Прайс</span>
    </a>
    <a href="#/works" class="nav-tab" data-view="works" title="Виды работ" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 8v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
      <span>Виды работ</span>
    </a>
    <a href="#/staff" class="nav-tab" data-view="staff" title="Сотрудники" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.6-3.2 3.2-4.8 6.5-4.8s5.9 1.6 6.5 4.8"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M18.5 20c-.2-1.4-.7-2.6-1.5-3.5"/></svg>
      <span>Сотрудники</span>
    </a>
    <a href="#/metrics" class="nav-tab" data-view="metrics" title="Метрики" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Метрики</span>
    </a>
  </nav>

  <div class="tb-search" id="searchBox">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Номер, клиент, телефон…" autocomplete="off" aria-label="Поиск заказов">
  </div>

  <div class="tb-right">
    <div class="counter" id="counter" title="Активные заказы и их сумма">
      <b>0</b><span>в работе</span>
    </div>
    <button class="btn btn-green" id="newOrderBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Новый заказ
    </button>
    <button class="profile-chip" id="profileChip" title="Сменить профиль">
      <span class="pc-dot" id="pcDot"></span>
      <span id="pcName">Сотрудник</span>
    </button>
  </div>
</header>

<!-- ============ ФИЛЬТРЫ И СОРТИРОВКА (только на доске) ============ -->
<div class="filters-row" id="filtersRow">
  <div class="filters" id="filters" role="group" aria-label="Фильтр по виду работ"></div>
  <label class="sort">
    <span>Порядок</span>
    <select id="sortSelect" aria-label="Порядок заказов в колонках">
      <option value="due">По сроку сдачи</option>
      <option value="new_top">Новые сверху</option>
      <option value="new_bottom">Новые снизу</option>
      <option value="number_asc">По номеру ↑</option>
      <option value="number_desc">По номеру ↓</option>
    </select>
  </label>
</div>

<!-- ============ СТРАНИЦА: ДОСКА ЗАКАЗОВ ============ -->
<main class="board page" id="pageBoard" aria-label="Доска заказов"></main>

<!-- ============ СТРАНИЦА: КЛИЕНТЫ ============ -->
<main class="page scroll-page" id="pageClients" hidden>
  <div class="page-inner" id="clientsContent"></div>
</main>

<!-- ============ СТРАНИЦА: ВИДЫ РАБОТ ============ -->
<main class="page scroll-page" id="pageWorks" hidden>
  <div class="page-inner" id="worksContent"></div>
</main>

<!-- ============ СТРАНИЦА: ПРАЙС ============ -->
<main class="page scroll-page" id="pagePrices" hidden>
  <div class="page-inner" id="pricesContent"></div>
</main>

<!-- ============ СТРАНИЦА: МЕТРИКИ ============ -->
<main class="page scroll-page" id="pageMetrics" hidden>
  <div class="page-inner" id="metricsContent"></div>
</main>

<!-- ============ СТРАНИЦА: СОТРУДНИКИ ============ -->
<main class="page scroll-page" id="pageStaff" hidden>
  <div class="page-inner" id="staffContent"></div>
</main>

<!-- ============ МОДАЛКА ============ -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <div>
        <div class="modal-eyebrow" id="modalEyebrow">Новый заказ</div>
        <h2 id="modalTitle">Вид работ</h2>
      </div>
      <button class="icon-btn" id="modalClose" aria-label="Закрыть">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- ============ ПОДТВЕРЖДЕНИЕ ============ -->
<!-- Отдельный слой: подтверждать приходится и поверх открытого окна,
     например при удалении поля в конструкторе видов работ. -->
<div class="overlay confirm-overlay" id="confirmOverlay" hidden>
  <div class="modal confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-head">
      <div>
        <div class="modal-eyebrow" id="confirmEyebrow">Подтверждение</div>
        <h2 id="confirmTitle">Вы уверены?</h2>
      </div>
    </div>
    <div class="modal-body" id="confirmBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="confirmNo" type="button">Отмена</button>
      <div class="spacer"></div>
      <button class="btn btn-green" id="confirmYes" type="button">Подтвердить</button>
    </div>
  </div>
</div>

<div class="ctx" id="ctx" role="menu" hidden></div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/static/js/app.js" defer></script>
</body>
</html>
